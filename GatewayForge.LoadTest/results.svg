<svg xmlns="http://www.w3.org/2000/svg" width="880" height="672" viewBox="0 0 880 672" role="img" aria-labelledby="t d">
<title id="t">Edge offload vs re-authenticating, from 8 to 16,384 concurrent connections</title>
<desc id="d">Two panels. Top: requests per second for both paths. Bottom: p99 latency on a log scale. Edge offload is 1.3x to 1.7x faster at every level.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #1f2328; }
  .panel { font-size: 13px; font-weight: 600; fill: #1f2328; }
  .sub   { font-size: 12px; fill: #59636e; }
  .axis  { font-size: 12px; fill: #59636e; }
  .val   { font-size: 10px; fill: #59636e; }
  .gain  { font-size: 14px; font-weight: 600; fill: #1a7f64; }
  .over  { font-size: 11px; font-style: italic; fill: #9a6700; }
  .grid  { stroke: #d1d9e0; stroke-width: 1; }
  .base  { stroke: #818b98; stroke-width: 1; }
  .zone  { fill: #9a6700; opacity: 0.07; }
  .secure   { fill: #8c959f; }
  .internal { fill: #1a7f64; }
  @media (prefers-color-scheme: dark) {
    .title, .panel { fill: #f0f6fc; }
    .sub, .axis, .val { fill: #9198a1; }
    .gain  { fill: #3fb68b; }
    .over  { fill: #d29922; }
    .grid  { stroke: #30363d; }
    .base  { stroke: #6e7681; }
    .zone  { fill: #d29922; opacity: 0.10; }
    .secure   { fill: #6e7681; }
    .internal { fill: #3fb68b; }
  }
</style>
<text class="title" x="72" y="28">Edge offload vs re-authenticating at the service, 8 to 16,384 concurrent connections</text>
<text class="sub" x="72" y="48">Same gateway authentication on both paths. Load generator inside Docker, mean of two passes.</text>
<rect class="secure" x="72" y="62" width="12" height="12" rx="2"/>
<text class="sub" x="90" y="73">Re-authenticates at the service (/api/secure)</text>
<rect class="internal" x="382" y="62" width="12" height="12" rx="2"/>
<text class="sub" x="400" y="73">Edge offload (/api/internal)</text>
<text class="panel" x="72" y="108">Throughput, requests per second (higher is better)</text>
<line class="base" x1="72" y1="336.0" x2="856" y2="336.0"/>
<text class="axis" x="64" y="340.0" text-anchor="end">0</text>
<line class="grid" x1="72" y1="288.5" x2="856" y2="288.5"/>
<text class="axis" x="64" y="292.5" text-anchor="end">10k</text>
