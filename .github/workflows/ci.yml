name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore GatewayForge.slnx

    - name: Build
      run: dotnet build GatewayForge.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test GatewayForge.slnx --configuration Release --no-build
